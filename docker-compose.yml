version: '3.8'

# AI 学习小书童 - 优化版 Docker Compose
# 特点:
# - SQLite 替代 PostgreSQL (轻量级)
# - FAISS + BM25 混合检索 (本地持久化)
# - 所有数据存储在项目 ./data 目录下
# - 支持服务拆分部署

services:
  # ============ 后端 API 服务 ============
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-assistant-backend
    ports:
      - "6000:6000"
    volumes:
      # 所有数据统一存储在项目 ./data 目录下
      - ./data/sqlite:/app/data/sqlite
      - ./data/faiss:/app/data/faiss
      - ./data/bm25:/app/data/bm25
      - ./data/uploads:/app/data/uploads
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/sqlite/app.db
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_STORE_PATH=/app/data/faiss
      - BM25_INDEX_PATH=/app/data/bm25
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    networks:
      - learning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ Celery 异步任务 ============
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-assistant-celery
    command: celery -A backend.app.core.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/faiss:/app/data/faiss
      - ./data/bm25:/app/data/bm25
      - ./data/uploads:/app/data/uploads
      - ./logs:/app/logs
    depends_on:
      - backend
      - redis
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/sqlite/app.db
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_STORE_PATH=/app/data/faiss
      - BM25_INDEX_PATH=/app/data/bm25
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - learning-network
    restart: unless-stopped

  # ============ 前端服务 ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:6000}
    container_name: learning-assistant-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - learning-network
    restart: unless-stopped

  # ============ Redis 缓存 & 消息队列 ============
  redis:
    image: redis:7-alpine
    container_name: learning-assistant-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      # Redis 数据也存储在项目目录下
      - ./data/redis:/data
    ports:
      - "6379:6379"
    networks:
      - learning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Nginx 反向代理 (生产环境可选) ============
  nginx:
    image: nginx:alpine
    container_name: learning-assistant-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - learning-network
    restart: unless-stopped
    profiles:
      - production

networks:
  learning-network:
    driver: bridge
