version: '3.8'

# =============================================================================
# AI 学习小书童 - 多模块 Docker Compose 配置
#
# 支持 6 个独立模块：default, rpj, xmx, wzy, wzm, tony
# 每个模块包含 API 服务和 Agent Worker 服务
#
# 使用方式:
#   启动所有服务:
#     docker-compose -f docker-compose.modules.yml --profile all up -d
#
#   启动特定模块:
#     docker-compose -f docker-compose.modules.yml --profile default up -d
#     docker-compose -f docker-compose.modules.yml --profile rpj up -d
#
#   启动所有 API:
#     docker-compose -f docker-compose.modules.yml --profile api up -d
#
#   启动所有 Agent:
#     docker-compose -f docker-compose.modules.yml --profile agent up -d
#
#   停止所有服务:
#     docker-compose -f docker-compose.modules.yml down
# =============================================================================

services:
  # ============ Redis (共享服务) ============
  redis:
    image: redis:7-alpine
    container_name: learning-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    networks:
      - learning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - all
      - default
      - rpj
      - xmx
      - wzy
      - wzm
      - tony
      - api
      - agent

  # ============ DEFAULT 模块 (跨学科查询) ============
  api-default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-api-default
    ports:
      - "6100:6100"
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/faiss/default:/app/data/faiss/default
      - ./data/bm25/default:/app/data/bm25/default
      - ./data/uploads:/app/data/uploads
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - MODULE_NAME=default
      - DATABASE_URL=sqlite+aiosqlite:///./data/sqlite/app.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - COMPANION_REQUIRE_SUBJECT_MODEL=${COMPANION_REQUIRE_SUBJECT_MODEL:-true}
    command: ["uvicorn", "backend.modules.default.main:app", "--host", "0.0.0.0", "--port", "6100"]
    networks:
      - learning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - all
      - default
      - api

  agent-default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-agent-default
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/faiss/default:/app/data/faiss/default
      - ./data/bm25/default:/app/data/bm25/default
      - ./data/uploads:/app/data/uploads
      - ./logs:/app/logs
    depends_on:
      - api-default
      - redis
    environment:
      - APP_ENV=production
      - MODULE_NAME=default
      - DATABASE_URL=sqlite+aiosqlite:///./data/sqlite/app.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: ["celery", "-A", "backend.modules.default.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "queue_default"]
    networks:
      - learning-network
    restart: unless-stopped
    profiles:
      - all
      - default
      - agent

