# =============================================================================
# AI Learning Assistant - Nginx Reverse Proxy
# External port: 8010
# Routes to vLLM model servers by module name
# =============================================================================

upstream rpj_model {
    server 127.0.0.1:8001;
}

upstream xmx_model {
    server 127.0.0.1:8002;
}

upstream wzy_model {
    server 127.0.0.1:8003;
}

upstream wzm_model {
    server 127.0.0.1:8004;
}

upstream tony_model {
    server 127.0.0.1:8005;
}

# Map module name to upstream
map $http_x_module $model_backend {
    default         "http://127.0.0.1:8005";  # Default: tony
    "rpj"           "http://127.0.0.1:8001";
    "xmx"           "http://127.0.0.1:8002";
    "wzy"           "http://127.0.0.1:8003";
    "wzm"           "http://127.0.0.1:8004";
    "tony"          "http://127.0.0.1:8005";
}

# Map URL path prefix to module
# /v1/rpj/... -> rpj module
# /v1/xmx/... -> xmx module
# /v1/wzy/... -> wzy module
# /v1/wzm/... -> wzm module
# /v1/tony/... -> tony module
# /v1/... (no prefix) -> default (tony)

map $request_uri $module_from_path {
    ~^/v1/rpj/      "http://127.0.0.1:8001";
    ~^/v1/xmx/      "http://127.0.0.1:8002";
    ~^/v1/wzy/      "http://127.0.0.1:8003";
    ~^/v1/wzm/      "http://127.0.0.1:8004";
    ~^/v1/tony/     "http://127.0.0.1:8005";
    default         "";
}

server {
    listen 8010;
    server_name _;

    # Increase timeouts for model inference (can be slow)
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;

    # Max body size for potential large requests
    client_max_body_size 50m;

    # CORS headers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Module" always;

    # Handle OPTIONS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Health check endpoint
    location /health {
        return 200 '{"status":"ok","service":"nginx-proxy","port":8010}';
        add_header Content-Type application/json;
    }

    # Module-specific paths: /v1/{module}/...
    # Routes to the corresponding vLLM server
    location ~ ^/v1/(rpj|xmx|wzy|wzm|tony)/(.*)$ {
        set $module $1;
        set $rest_path $2;

        # Resolve backend based on module
        set $backend "";
        if ($module = "rpj") { set $backend "http://127.0.0.1:8001"; }
        if ($module = "xmx") { set $backend "http://127.0.0.1:8002"; }
        if ($module = "wzy") { set $backend "http://127.0.0.1:8003"; }
        if ($module = "wzm") { set $backend "http://127.0.0.1:8004"; }
        if ($module = "tony") { set $backend "http://127.0.0.1:8005"; }

        proxy_pass $backend/v1/$rest_path;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Default route: pass through to tony module (8005) as default
    # Strip /v1/ prefix if present, otherwise pass as-is
    location /v1/ {
        proxy_pass http://127.0.0.1:8005/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Root fallback
    location / {
        proxy_pass http://127.0.0.1:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
